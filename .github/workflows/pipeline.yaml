name: DeepEval AI Skill Evaluation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  evaluate-ai-skill:
    runs-on: self-hosted

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure UTF-8 encoding
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new()

      - name: Check Python version
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install deepeval langchain-ollama
          python -m pip install "portalocker[win32]"

      - name: Verify evaluation dependencies
        run: |
          python -c "import deepeval; import langchain_ollama; print('Evaluation dependencies are installed')"

      - name: Verify DeepEval
        run: |
          python -m pip show deepeval
          deepeval --version
          where.exe deepeval

      - name: Check Ollama
        run: |
          ollama --version
          ollama list

      - name: Run DeepEval tests
        run: |
          Set-Location code
          deepeval test run test_agent.py